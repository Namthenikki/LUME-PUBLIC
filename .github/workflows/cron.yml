# Sends due reminders every 5 minutes and syncs every student's LMS hourly. On a public repo these
# runs are free. GitHub can start scheduled runs a few minutes late; Lume also checks reminders whenever the
# app or the Android alarm sync talks to it, so a late run is covered.
#
# Needs the repository secret CRON_SECRET (Settings → Secrets and variables → Actions). APP_URL is
# optional and defaults to the deployed address. GitHub runs these schedules rarely on small repos
# (a handful a day), so an outside scheduler like cron-job.org is the dependable one.
name: Lume cron

on:
  schedule:
    - cron: '*/5 * * * *' # reminders
    - cron: '5 * * * *' # LMS sync
  workflow_dispatch:

env:
  APP_URL: ${{ secrets.APP_URL || 'https://lume-public.vercel.app' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  sync:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync the LMS
        run: |
          test -n "$CRON_SECRET" || { echo "::warning::Add the CRON_SECRET repository secret"; exit 0; }
          curl -fsS --retry 2 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/sync"

  remind:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        run: |
          test -n "$CRON_SECRET" || { echo "::warning::Add the CRON_SECRET repository secret"; exit 0; }
          curl -fsS --retry 2 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/remind"
